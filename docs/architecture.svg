<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Agent Knowledge Hub architecture</title>
  <desc id="desc">Multiple coding agents connect to one local hub for discovery, shared project memory, handoff, and role-skill selection.</desc>
  <rect width="1120" height="470" rx="24" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#0f172a">One local hub for every coding agent</text>
  <text x="40" y="76" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#475569">多个 Agent，同一份项目记忆</text>
  <g font-family="Segoe UI, PingFang SC, sans-serif">
    <rect x="40" y="112" width="250" height="310" rx="18" fill="#ffffff" stroke="#d6deea"/>
    <text x="64" y="148" font-size="16" font-weight="700" fill="#0f172a">Agents · 客户端</text>
    <g fill="#eff6ff" stroke="#bfdbfe">
      <rect x="64" y="172" width="202" height="38" rx="10"/><rect x="64" y="222" width="202" height="38" rx="10"/><rect x="64" y="272" width="202" height="38" rx="10"/><rect x="64" y="322" width="202" height="38" rx="10"/><rect x="64" y="372" width="202" height="28" rx="10"/>
    </g>
    <g fill="#1e3a8a" font-size="15">
      <text x="84" y="197">Codex</text><text x="84" y="247">Claude Code</text><text x="84" y="297">Cursor</text><text x="84" y="347">WorkBuddy</text><text x="84" y="391">ZCode</text>
    </g>
    <rect x="350" y="112" width="390" height="310" rx="18" fill="#ffffff" stroke="#93c5fd"/>
    <text x="374" y="148" font-size="16" font-weight="700" fill="#0f172a">Hub · 本地知识中枢</text>
    <g fill="#f8fafc" stroke="#d6deea">
      <rect x="374" y="176" width="166" height="96" rx="14"/><rect x="552" y="176" width="164" height="96" rx="14"/><rect x="374" y="292" width="166" height="96" rx="14"/><rect x="552" y="292" width="164" height="96" rx="14"/>
    </g>
    <g fill="#0f172a" font-size="15" font-weight="700">
      <text x="394" y="210">Discover</text><text x="572" y="210">Remember</text><text x="394" y="326">Handoff</text><text x="572" y="326">Choose</text>
    </g>
    <g fill="#475569" font-size="13">
      <text x="394" y="234">发现已配置客户端</text><text x="572" y="234">项目、决策、验证</text><text x="394" y="350">交给下一个 Agent</text><text x="572" y="350">选择常用岗位技能</text>
    </g>
    <rect x="800" y="112" width="280" height="310" rx="18" fill="#ffffff" stroke="#d6deea"/>
    <text x="824" y="148" font-size="16" font-weight="700" fill="#0f172a">Result · 开发结果</text>
    <g fill="#f0fdf4" stroke="#bbf7d0">
      <rect x="824" y="176" width="232" height="64" rx="14"/><rect x="824" y="256" width="232" height="64" rx="14"/><rect x="824" y="336" width="232" height="62" rx="14"/>
    </g>
    <g fill="#14532d" font-size="14" font-weight="700">
      <text x="844" y="203">Continue</text><text x="844" y="283">Separate</text><text x="844" y="363">Control</text>
    </g>
    <g fill="#166534" font-size="13">
      <text x="844" y="223">换 Agent 后继续同一项目</text><text x="844" y="303">各 Agent 独立常用清单</text><text x="844" y="383">工作与个人记忆分开授权</text>
    </g>
    <path d="M290 267 H350" stroke="#2563eb" stroke-width="2"/><path d="M740 267 H800" stroke="#2563eb" stroke-width="2"/>
  </g>
</svg>
