<svg xmlns="http://www.w3.org/2000/svg" width="900" height="698" viewBox="0 0 900 698" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">跨 Agent 项目接力</title><desc id="desc">稳定项目基线独立保存，每次任务记录修改、决策、验证与未完成项，下一位 Agent 读取同一份项目状态。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#8092AA" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style>
<rect x="1" y="1" width="898" height="696" rx="22" fill="#F8FAFD" stroke="#D9E3ED"/>
<text x="32" y="40" font-size="16" font-weight="650" fill="#087E83" text-anchor="start">02  /  项目连续性</text>
<text x="32" y="89" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">换一个 Agent，接续同一项目</text>
<text x="32" y="121" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">开工先读基线与交接，工作后留下新的检查点。</text>
<rect x="32" y="149" width="836" height="75" rx="12" fill="#EBF1FD" stroke="#CBDAF6"/>
<text x="54" y="182" font-size="22" font-weight="700" fill="#245FD4" text-anchor="start">稳定项目基线</text>
<text x="54" y="208" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">目标 · 限制 · 项目目录 · 长期约定</text>
<rect x="32" y="261" width="376" height="138" rx="14" fill="#FFFFFF" stroke="#CCD9E7"/>
<rect x="50" y="279" width="36" height="36" rx="9" fill="#087E83" stroke="#087E83"/>
<text x="68" y="305" font-size="22" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="100" y="305" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start">识别项目，读取现状</text>
<text x="52" y="345" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">项目基线 + 相关历史交接</text>
<text x="52" y="373" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">获授权的已确认协作偏好</text>
<rect x="492" y="261" width="376" height="138" rx="14" fill="#FFFFFF" stroke="#CCD9E7"/>
<rect x="510" y="279" width="36" height="36" rx="9" fill="#087E83" stroke="#087E83"/>
<text x="528" y="305" font-size="22" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="560" y="305" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start">执行任务，保留验证</text>
<text x="512" y="345" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">记录实际修改与决策</text>
<text x="512" y="373" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">成功与失败都保留证据</text>
<rect x="492" y="449" width="376" height="138" rx="14" fill="#FFFFFF" stroke="#CCD9E7"/>
<rect x="510" y="467" width="36" height="36" rx="9" fill="#087E83" stroke="#087E83"/>
<text x="528" y="493" font-size="22" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="560" y="493" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start">保存本次检查点</text>
<text x="512" y="533" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">修改 · 决策 · 验证</text>
<text x="512" y="561" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">未完成项与下一步</text>
<rect x="32" y="449" width="376" height="138" rx="14" fill="#FFFFFF" stroke="#CCD9E7"/>
<rect x="50" y="467" width="36" height="36" rx="9" fill="#087E83" stroke="#087E83"/>
<text x="68" y="493" font-size="22" font-weight="700" fill="white" text-anchor="middle">4</text>
<text x="100" y="493" font-size="25" font-weight="650" fill="#172B4D" text-anchor="start">下一位 Agent 接手</text>
<text x="52" y="533" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">读取同一份当前项目状态</text>
<text x="52" y="561" font-size="20" font-weight="400" fill="#52657C" text-anchor="start">从未完成事项继续推进</text>
